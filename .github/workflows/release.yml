name: Release
# Tag a version (git tag v0.1.0 && git push --tags) to build the Windows
# installer, sign the update manifest and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Freeze the backend
        shell: bash
        run: |
          uv venv
          uv pip install --require-hashes -r locks/windows.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          uv pip install --require-hashes -r locks/dev.txt
          uv run --no-sync pyinstaller packaging/ekko-backend.spec --noconfirm --distpath dist-backend --workpath build-backend
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: {package_json_file: ekko-ui/package.json}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ekko-ui/pnpm-lock.yaml
      - run: pnpm -C ekko-ui install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with: {toolchain: stable}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: {workspaces: ekko-ui/src-tauri}
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ekko-ui
          tagName: ${{ github.ref_name }}
          releaseName: ekko ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        id: attest
        with:
          subject-path: ekko-ui/src-tauri/target/release/bundle/nsis/*.exe
      - name: Attach provenance to the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.attest.outputs.bundle-path }}" --repo "${{ github.repository }}"
