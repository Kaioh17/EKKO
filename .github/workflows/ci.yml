name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install locked dependencies
        shell: bash
        run: |
          uv venv
          lock=$([ "$RUNNER_OS" = Windows ] && echo windows || echo linux)
          uv pip install --require-hashes -r locks/$lock.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          uv pip install --require-hashes -r locks/dev.txt
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Tests
        run: uv run --no-sync python -m pytest
      - name: Dependency audit
        shell: bash
        run: |
          lock=$([ "$RUNNER_OS" = Windows ] && echo windows || echo linux)
          uv run --no-sync pip-audit -r locks/$lock.txt --disable-pip --no-deps

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: {package_json_file: ekko-ui/package.json}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ekko-ui/pnpm-lock.yaml
      - run: pnpm -C ekko-ui install --frozen-lockfile
      - run: pnpm -C ekko-ui lint
      - run: pnpm -C ekko-ui test
      - run: pnpm -C ekko-ui audit --prod

  rust:
    name: Tauri shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with: {toolchain: stable, components: clippy}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: {workspaces: ekko-ui/src-tauri}
      - working-directory: ekko-ui/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - working-directory: ekko-ui/src-tauri
        run: cargo test --locked
